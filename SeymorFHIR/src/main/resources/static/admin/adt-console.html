<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CST Seymour Millennium — Practice ADT Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 27, 45, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-glow: rgba(6, 182, 212, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
        }

        header {
            background-color: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-logo::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .badge {
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            border-left: 4px solid var(--accent-cyan);
            padding-left: 0.75rem;
            line-height: 1.2;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        @media (max-width: 640px) {
            .form-group.full-width {
                grid-column: span 1;
            }
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input, select, textarea {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background-color: rgba(15, 23, 42, 0.8);
        }

        select option {
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: white;
            font-weight: 600;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(6, 182, 212, 0.45);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Payload / Console display */
        .terminal-panel {
            background-color: #05070c;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.25rem;
            font-family: 'Courier New', Courier, monospace;
            position: relative;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.5rem;
            margin-bottom: 0.75rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .terminal-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .terminal-dot.red { background-color: var(--accent-red); }
        .terminal-dot.yellow { background-color: #eab308; }
        .terminal-dot.green { background-color: var(--accent-green); }

        .terminal-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .terminal-body textarea {
            background: transparent;
            border: none;
            color: var(--accent-cyan);
            font-family: inherit;
            font-size: 0.85rem;
            width: 100%;
            height: 100%;
            min-height: 220px;
            resize: none;
            outline: none;
            box-shadow: none;
            padding: 0;
        }

        /* Tables */
        .table-container {
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            background-color: rgba(15, 23, 42, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: rgba(30, 41, 59, 0.6);
            color: var(--text-primary);
            font-weight: 600;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            font-weight: 400;
        }

        tr:hover td {
            color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.02);
        }

        .tag-event {
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .tag-event.admit {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .tag-event.transfer {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .tag-event.discharge {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .log-section {
            grid-column: span 2;
        }

        @media (max-width: 1024px) {
            .log-section {
                grid-column: span 1;
            }
        }

        /* Notifications & status */
        .status-banner {
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .status-banner.success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-banner.error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .pulse-live {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--accent-green);
            font-weight: 500;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.9);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.15);
                opacity: 1;
                box-shadow: 0 0 12px var(--accent-green);
            }
            100% {
                transform: scale(0.9);
                opacity: 0.6;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo">CST Seymour Millennium</div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div class="pulse-live">
                <div class="pulse-dot"></div>
                LIVE FEED
            </div>
            <span class="badge">EHR Practice Console</span>
        </div>
    </header>

    <main>
        <!-- Form Panel -->
        <div class="card">
            <h2>Fire ADT Notification Event</h2>
            
            <div id="status-banner" class="status-banner"></div>
            
            <!-- Collapsible Register Patient Panel -->
            <div id="register-patient-panel" style="display: none; background: rgba(15, 23, 42, 0.4); border: 1px dashed var(--card-border); padding: 1.25rem; border-radius: 8px; margin-bottom: 1.5rem; flex-direction: column; gap: 1rem; animation: slideIn 0.3s ease-out;">
                <h3 style="font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 600; color: var(--accent-cyan);">New Patient Registration</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="new-mrn">MRN *</label>
                        <input type="text" id="new-mrn" placeholder="e.g. MRN-20005">
                    </div>
                    <div class="form-group">
                        <label for="new-healthcard">Health Card (BC PHN)</label>
                        <input type="text" id="new-healthcard" placeholder="e.g. BC9001234567">
                    </div>
                    <div class="form-group">
                        <label for="new-firstname">First Name *</label>
                        <input type="text" id="new-firstname" placeholder="e.g. John">
                    </div>
                    <div class="form-group">
                        <label for="new-lastname">Last Name *</label>
                        <input type="text" id="new-lastname" placeholder="e.g. Doe">
                    </div>
                    <div class="form-group">
                        <label for="new-dob">Date of Birth</label>
                        <input type="date" id="new-dob">
                    </div>
                    <div class="form-group">
                        <label for="new-gender">Gender</label>
                        <select id="new-gender">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                            <option value="unknown">Unknown</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="new-phone">Phone</label>
                        <input type="text" id="new-phone" placeholder="e.g. 604-555-0101">
                    </div>
                    <div class="form-group">
                        <label for="new-email">Email</label>
                        <input type="email" id="new-email" placeholder="e.g. j.doe@example.com">
                    </div>
                    <div class="form-group">
                        <label for="new-bloodtype">Blood Type</label>
                        <input type="text" id="new-bloodtype" placeholder="e.g. O+">
                    </div>
                    <div class="form-group">
                        <label for="new-allergies">Allergies</label>
                        <input type="text" id="new-allergies" placeholder="e.g. Latex, Penicillin">
                    </div>
                </div>
                <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 0.5rem;">
                    <button type="button" id="cancel-register-btn" class="btn" style="background: rgba(255,255,255,0.05); color: var(--text-secondary); box-shadow: none; border: 1px solid var(--card-border);">Cancel</button>
                    <button type="button" id="submit-register-btn" class="btn">Register & Select</button>
                </div>
            </div>

            <form id="adt-form">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
                            <label for="patient-select">Select Patient *</label>
                            <button type="button" id="toggle-register-btn" class="badge" style="cursor: pointer; background: rgba(59, 130, 246, 0.1); color: var(--accent-cyan); border-color: rgba(6, 182, 212, 0.2); transition: var(--transition);">+ Register New Patient</button>
                        </div>
                        <select id="patient-select">
                            <option value="">-- Choose Patient --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="event-type">ADT Event Type *</label>
                        <select id="event-type">
                            <option value="ADMIT">ADMIT (A01)</option>
                            <option value="TRANSFER">TRANSFER (A02)</option>
                            <option value="DISCHARGE">DISCHARGE (A03)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="patient-class">Patient Class</label>
                        <select id="patient-class">
                            <option value="INPATIENT">INPATIENT</option>
                            <option value="OUTPATIENT">OUTPATIENT</option>
                            <option value="EMERGENCY">EMERGENCY</option>
                            <option value="OBSERVATION">OBSERVATION</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="facility">Facility</label>
                        <input type="text" id="facility" value="Vancouver General Hospital">
                    </div>

                    <div class="form-group">
                        <label for="ward">Ward</label>
                        <input type="text" id="ward" placeholder="e.g. Telemetry, ICU">
                    </div>

                    <div class="form-group">
                        <label for="room">Room</label>
                        <input type="text" id="room" placeholder="e.g. 516">
                    </div>

                    <div class="form-group">
                        <label for="bed">Bed</label>
                        <input type="text" id="bed" placeholder="e.g. A">
                    </div>

                    <div class="form-group">
                        <label for="attending-physician">Attending Physician</label>
                        <input type="text" id="attending-physician" placeholder="e.g. Dr. Sarah Park">
                    </div>

                    <div class="form-group">
                        <label for="visit-number">Visit Number (FIN)</label>
                        <input type="text" id="visit-number" placeholder="Auto-generated if left blank">
                    </div>

                    <div class="form-group full-width">
                        <label for="admitting-diagnosis">Admitting Diagnosis</label>
                        <input type="text" id="admitting-diagnosis" placeholder="e.g. Uncontrolled Hyperglycemia">
                    </div>

                    <div class="form-group full-width">
                        <label for="notes">Encounter Notes</label>
                        <textarea id="notes" placeholder="Enter clinical notes relating to this ADT event..."></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label for="webhook-url">Webhook Listener URL</label>
                        <input type="text" id="webhook-url" value="http://localhost:8081/adt-webhook">
                    </div>
                </div>
                
                <button type="submit" class="btn" style="margin-top: 1.5rem; width: 100%;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Fire ADT Event
                </button>
            </form>
        </div>

        <!-- Terminal & Real-Time Sent payload Panel -->
        <div class="card">
            <h2>Last Sent Webhook Payload</h2>
            
            <div class="terminal-panel">
                <div class="terminal-header">
                    <div class="terminal-dots">
                        <div class="terminal-dot red"></div>
                        <div class="terminal-dot yellow"></div>
                        <div class="terminal-dot green"></div>
                    </div>
                    <span>webhook_payload.json</span>
                </div>
                <div class="terminal-body">
                    <textarea id="webhook-payload" readonly placeholder="// JSON payload will appear here after firing an ADT event..."></textarea>
                </div>
            </div>
        </div>

        <!-- Live ADT Log Panel -->
        <div class="card log-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Live ADT Event Log (Last 20)</h2>
                <div style="font-size: 0.8rem; color: var(--text-secondary);" id="refresh-counter">Refreshing in 10s...</div>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Patient</th>
                            <th>MRN</th>
                            <th>Event Type</th>
                            <th>Facility</th>
                            <th>Ward</th>
                            <th>Visit Number</th>
                        </tr>
                    </thead>
                    <tbody id="adt-log-body">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 2rem;">Loading live ADT events...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Caches mappings of Patient Database ID -> MRN and ID -> Name
        const patientCache = {};
        let refreshSeconds = 10;
        let refreshInterval = null;

        // Fetch all patients on load to populate select list
        async function loadPatients() {
            try {
                const response = await fetch('/api/fhir/Patient');
                if (!response.ok) throw new Error('Failed to load patients');
                const bundle = await response.json();
                
                const select = document.getElementById('patient-select');
                
                if (bundle.entry && bundle.entry.length > 0) {
                    bundle.entry.forEach(entry => {
                        const p = entry.resource;
                        const patientId = p.id;
                        
                        // Parse name
                        let name = 'Unknown';
                        if (p.name && p.name[0]) {
                            const given = p.name[0].given ? p.name[0].given.join(' ') : '';
                            const family = p.name[0].family ? p.name[0].family : '';
                            name = `${given} ${family}`.trim();
                        }
                        
                        // Parse MRN
                        let mrn = 'N/A';
                        if (p.identifier) {
                            const mrnIdent = p.identifier.find(id => id.system === 'urn:oid:2.16.840.1.113883.4.1');
                            if (mrnIdent) mrn = mrnIdent.value;
                        }
                        
                        // Cache for lookup
                        patientCache[patientId] = { mrn, name };
                        
                        // Append to select options
                        const option = document.createElement('option');
                        option.value = patientId;
                        option.textContent = `${mrn} — ${name}`;
                        select.appendChild(option);
                    });
                }
            } catch (err) {
                console.error(err);
                showStatus('Failed to load patient listing.', 'error');
            }
        }

        // Fetch ADT events log and update table
        async function loadAdtLogs() {
            try {
                const response = await fetch('/api/fhir/Encounter/adt');
                if (!response.ok) throw new Error('Failed to load ADT logs');
                const bundle = await response.json();
                
                const tbody = document.getElementById('adt-log-body');
                tbody.innerHTML = '';
                
                if (bundle.entry && bundle.entry.length > 0) {
                    // Sort by time descending (newest first) and take top 20
                    const entries = [...bundle.entry]
                        .map(e => e.resource)
                        .sort((a, b) => {
                            const dateA = a.period && a.period.start ? new Date(a.period.start) : new Date(0);
                            const dateB = b.period && b.period.start ? new Date(b.period.start) : new Date(0);
                            return dateB - dateA;
                        })
                        .slice(0, 20);

                    entries.forEach(resource => {
                        const tr = document.createElement('tr');
                        
                        // Formatted Time
                        let timeStr = 'N/A';
                        if (resource.period && resource.period.start) {
                            const dt = new Date(resource.period.start);
                            timeStr = dt.toLocaleString();
                        }
                        
                        // Patient Name
                        const patientName = resource.subject ? resource.subject.display : 'Unknown';
                        
                        // Patient MRN (resolve via cache or extract from displays)
                        let mrn = 'N/A';
                        if (resource.subject && resource.subject.reference) {
                            const pId = resource.subject.reference.split('/')[1];
                            if (patientCache[pId]) mrn = patientCache[pId].mrn;
                        }
                        
                        // Event Type
                        const eventType = resource.type && resource.type[0] && resource.type[0].coding && resource.type[0].coding[0] 
                                ? resource.type[0].coding[0].display 
                                : 'UPDATE';
                        
                        // Facility & Ward
                        let facility = 'N/A';
                        let ward = 'N/A';
                        if (resource.location && resource.location[0] && resource.location[0].location) {
                            const display = resource.location[0].location.display || '';
                            const parts = display.split(' - ');
                            facility = parts[0] || 'N/A';
                            ward = parts[1] ? parts[1].split(',')[0] : 'N/A';
                        }
                        
                        // Visit Number
                        const visitNumber = resource.extension ? resource.extension.visitNumber : 'N/A';
                        
                        tr.innerHTML = `
                            <td>${timeStr}</td>
                            <td style="font-weight: 500; color: var(--text-primary);">${patientName}</td>
                            <td><code>${mrn}</code></td>
                            <td><span class="tag-event ${eventType.toLowerCase()}">${eventType}</span></td>
                            <td>${facility}</td>
                            <td>${ward}</td>
                            <td><code>${visitNumber}</code></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 2rem;">No ADT events found.</td></tr>`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Show success/error notifications
        function showStatus(message, type) {
            const banner = document.getElementById('status-banner');
            banner.textContent = message;
            banner.className = `status-banner ${type}`;
            banner.style.display = 'block';
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                banner.style.display = 'none';
            }, 5000);
        }

        // Reset auto-refresh timer countdown
        function resetAutoRefresh() {
            clearInterval(refreshInterval);
            refreshSeconds = 10;
            const counterDiv = document.getElementById('refresh-counter');
            
            refreshInterval = setInterval(() => {
                refreshSeconds--;
                if (refreshSeconds <= 0) {
                    refreshSeconds = 10;
                    loadAdtLogs();
                }
                counterDiv.textContent = `Refreshing in ${refreshSeconds}s...`;
            }, 1000);
        }

        // Form submission handling
        document.getElementById('adt-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Check if registration panel is currently open
            const registerPanel = document.getElementById('register-patient-panel');
            if (registerPanel && registerPanel.style.display !== 'none') {
                showStatus('Please complete or cancel the patient registration before firing an ADT event.', 'error');
                return;
            }
            
            const patientId = document.getElementById('patient-select').value;
            const eventType = document.getElementById('event-type').value;
            const patientClass = document.getElementById('patient-class').value;
            const facility = document.getElementById('facility').value;
            const ward = document.getElementById('ward').value;
            const room = document.getElementById('room').value;
            const bed = document.getElementById('bed').value;
            const attendingPhysician = document.getElementById('attending-physician').value;
            const admittingDiagnosis = document.getElementById('admitting-diagnosis').value;
            let visitNumber = document.getElementById('visit-number').value;
            const notes = document.getElementById('notes').value;
            const webhookUrl = document.getElementById('webhook-url').value;

            if (!patientId) {
                showStatus('Please select a patient.', 'error');
                return;
            }

            // Auto generate Visit Number if blank
            if (!visitNumber.trim()) {
                visitNumber = `VN-${Date.now()}`;
                document.getElementById('visit-number').value = visitNumber;
            }

            // Map ADT event code
            let eventCode = 'A08';
            if (eventType === 'ADMIT') eventCode = 'A01';
            else if (eventType === 'TRANSFER') eventCode = 'A02';
            else if (eventType === 'DISCHARGE') eventCode = 'A03';

            const payload = {
                eventType: eventType,
                eventCode: eventCode,
                eventDatetime: new Date().toISOString().split('.')[0], // Local format YYYY-MM-DDTHH:MM:SS
                facility: facility,
                ward: ward,
                room: room,
                bed: bed,
                attendingPhysician: attendingPhysician,
                admittingDiagnosis: admittingDiagnosis,
                visitNumber: visitNumber,
                patientClass: patientClass,
                notes: notes
            };

            const headers = {
                'Content-Type': 'application/json'
            };

            if (webhookUrl && webhookUrl.trim() !== '') {
                headers['X-Webhook-Url'] = webhookUrl.trim();
            }

            try {
                const response = await fetch(`/api/fhir/Encounter/adt/${patientId}`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errRes = await response.json();
                    const errMsg = errRes.issue && errRes.issue[0] ? errRes.issue[0].diagnostics : 'Server rejected request';
                    throw new Error(errMsg);
                }

                showStatus('ADT event fired and logged successfully!', 'success');
                
                // Show Webhook JSON Payload in terminal text area
                const patient = patientCache[patientId] || { mrn: 'Unknown', name: 'Unknown' };
                const webhookPayload = {
                    patientId: patientId,
                    mrn: patient.mrn,
                    eventType: eventType,
                    eventCode: eventCode,
                    visitNumber: visitNumber,
                    facility: facility,
                    timestamp: new Date().toISOString(),
                    callbackBaseUrl: window.location.origin
                };

                document.getElementById('webhook-payload').value = JSON.stringify(webhookPayload, null, 2);

                // UI Polish: Clear fields that change often
                document.getElementById('ward').value = '';
                document.getElementById('room').value = '';
                document.getElementById('bed').value = '';
                document.getElementById('admitting-diagnosis').value = '';
                document.getElementById('visit-number').value = '';
                document.getElementById('notes').value = '';

                // Load fresh logs immediately
                loadAdtLogs();
                resetAutoRefresh();

            } catch (err) {
                console.error(err);
                showStatus(`Failed to fire ADT event: ${err.message}`, 'error');
            }
        });

        // Registration Panel Toggle Handling
        const toggleBtn = document.getElementById('toggle-register-btn');
        const registerPanel = document.getElementById('register-patient-panel');
        const cancelBtn = document.getElementById('cancel-register-btn');

        toggleBtn.addEventListener('click', () => {
            if (registerPanel.style.display === 'none') {
                registerPanel.style.display = 'flex';
                toggleBtn.textContent = 'Close Panel';
            } else {
                registerPanel.style.display = 'none';
                toggleBtn.textContent = '+ Register New Patient';
            }
        });

        cancelBtn.addEventListener('click', () => {
            registerPanel.style.display = 'none';
            toggleBtn.textContent = '+ Register New Patient';
        });

        // Intercept Enter key inside register-patient-panel to submit registration instead of ADT form
        registerPanel.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('submit-register-btn').click();
            }
        });

        // Submit New Patient Registration
        const submitRegisterBtn = document.getElementById('submit-register-btn');
        submitRegisterBtn.addEventListener('click', async () => {
            const mrn = document.getElementById('new-mrn').value.trim();
            const firstName = document.getElementById('new-firstname').value.trim();
            const lastName = document.getElementById('new-lastname').value.trim();
            const dob = document.getElementById('new-dob').value;
            const gender = document.getElementById('new-gender').value;
            const phone = document.getElementById('new-phone').value.trim();
            const email = document.getElementById('new-email').value.trim();
            const bloodType = document.getElementById('new-bloodtype').value.trim();
            const allergies = document.getElementById('new-allergies').value.trim();
            const healthCard = document.getElementById('new-healthcard').value.trim();

            if (!mrn || !firstName || !lastName) {
                showStatus('Please fill in all required patient fields (MRN, First Name, Last Name).', 'error');
                return;
            }

            const patientPayload = {
                mrn: mrn,
                firstName: firstName,
                lastName: lastName,
                dateOfBirth: dob ? dob : null,
                gender: gender,
                phone: phone ? phone : null,
                email: email ? email : null,
                bloodType: bloodType ? bloodType : null,
                allergies: allergies ? allergies : null,
                healthCardNumber: healthCard ? healthCard : null,
                active: true
            };

            try {
                const response = await fetch('/api/fhir/Patient', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(patientPayload)
                });

                if (!response.ok) {
                    const errRes = await response.json();
                    const errMsg = errRes.issue && errRes.issue[0] ? errRes.issue[0].diagnostics : 'Failed to register patient';
                    throw new Error(errMsg);
                }

                const createdPatient = await response.json();
                const patientId = createdPatient.id;

                // Cache the patient details
                const fullName = `${firstName} ${lastName}`.trim();
                patientCache[patientId] = { mrn: mrn, name: fullName };

                // Add the new option to select dropdown and select it
                const select = document.getElementById('patient-select');
                const option = document.createElement('option');
                option.value = patientId;
                option.textContent = `${mrn} — ${fullName}`;
                select.appendChild(option);
                select.value = patientId;

                // Clear fields
                document.getElementById('new-mrn').value = '';
                document.getElementById('new-firstname').value = '';
                document.getElementById('new-lastname').value = '';
                document.getElementById('new-dob').value = '';
                document.getElementById('new-phone').value = '';
                document.getElementById('new-email').value = '';
                document.getElementById('new-bloodtype').value = '';
                document.getElementById('new-allergies').value = '';
                document.getElementById('new-healthcard').value = '';

                // Close panel
                registerPanel.style.display = 'none';
                toggleBtn.textContent = '+ Register New Patient';

                showStatus(`Registered and selected patient ${fullName} successfully!`, 'success');

            } catch (err) {
                console.error(err);
                showStatus(`Registration failed: ${err.message}`, 'error');
            }
        });

        // Initialize elements on load
        window.addEventListener('DOMContentLoaded', async () => {
            await loadPatients();
            await loadAdtLogs();
            resetAutoRefresh();
        });
    </script>
</body>
</html>
