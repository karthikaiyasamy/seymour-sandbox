spring.application.name=seymour-sandbox

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/seymour_db
spring.datasource.username=karthik
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=8090

# Pretty print JSON
spring.jackson.serialization.indent-output=true

# Logging
logging.level.com.healthcare=INFO
logging.level.org.springframework.web=WARN

# Resilience4j Bulkhead Configuration (Thread Pool Isolation)
# Heavy Report Pool: Max 2 parallel executions, 1 queued item
resilience4j.thread-pool-bulkhead.instances.heavyReportPool.max-thread-pool-size=2
resilience4j.thread-pool-bulkhead.instances.heavyReportPool.core-thread-pool-size=1
resilience4j.thread-pool-bulkhead.instances.heavyReportPool.queue-capacity=1

# Standard Bulkhead (Semaphore Mode): Max 2 concurrent executions
resilience4j.bulkhead.instances.reportBulkhead.max-concurrent-calls=2
resilience4j.bulkhead.instances.reportBulkhead.max-wait-duration=100ms

