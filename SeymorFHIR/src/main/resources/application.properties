spring.application.name=seymour-sandbox

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/seymour_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:seymour_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:seymour_secure_dev_password_2026}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.bytecode.provider=none

# Spring Boot Actuator Exposure for Health Probes
management.endpoints.web.exposure.include=health,info

# Server
server.port=8090

# Pretty print JSON
spring.jackson.serialization.indent-output=true

# Logging
logging.level.com.healthcare=INFO
logging.level.org.springframework.web=WARN

# Resilience4j Bulkhead Configuration (Semaphore Concurrency Control)
# Max 2 concurrent heavy report executions permitted; overflow requests trigger fallback
resilience4j.bulkhead.instances.reportBulkhead.max-concurrent-calls=2
resilience4j.bulkhead.instances.reportBulkhead.max-wait-duration=100ms

# OpenAPI 3 / Swagger UI Aggregator Settings
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Centralized Regional Portal API Specs Dropdown
springdoc.swagger-ui.urls[0].name=Seymour Regional EHR (Java - Port 8090)
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Terry Fox Cancer Hospital (HAPI FHIR Java - Port 8085)
springdoc.swagger-ui.urls[1].url=http://localhost:8085/v3/api-docs
springdoc.swagger-ui.urls[2].name=Langley General Gateway (C# .NET 10 - Port 8083)
springdoc.swagger-ui.urls[2].url=http://localhost:8083/openapi/v1.json

# SMART on FHIR v2.0 JWT & JWKS Configuration
smart.jwt.key-id=${SMART_JWT_KEY_ID:seymour-smart-key-1}
smart.jwt.issuer=${SMART_JWT_ISSUER:http://localhost:8090}
smart.jwt.audience=${SMART_JWT_AUDIENCE:http://localhost:8090/api/fhir}
