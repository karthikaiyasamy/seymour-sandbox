spring.application.name=terry-fox-memorial

# Server Port
server.port=8085

# DataSource (H2 in-memory DB with PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:terryfox_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson formatting
spring.jackson.serialization.indent-output=true

# Logging
logging.level.com.terryfox.hospital=INFO
logging.level.ca.uhn.fhir=INFO
logging.level.org.springframework.web=WARN

# Hibernate Bytecode & Java 25 compatibility
spring.jpa.properties.hibernate.bytecode.provider=none

# SMART on FHIR Federated Identity & JWKS Trust Configuration
seymour.auth.jwks-url=${SEYMOUR_AUTH_JWKS_URL:http://localhost:8090/.well-known/jwks.json}

